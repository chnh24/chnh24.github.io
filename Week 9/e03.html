<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ex03</title>
</head>

<body>

<script>
    var txta = prompt("Enter any integer");

    if (txta === null || txta.trim() === "" || isNaN(txta)) {
        document.write("<p style='color:red;'>You must enter a number</p>");
    } 
    else {
        var num = parseInt(txta);

        if (num % 2 === 0) {
            document.write("<p style='color:green;'><b>" + num + " is an even number</b></p>");
        } else {
            document.write("<p style='color:blue;'><i>" + num + " is an odd number</i></p>");
        }
    }
</script>

</body>
</html>
