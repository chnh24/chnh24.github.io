<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>e02</title>

<style>
body {
    font-family: Arial;
    background: #eee;
    text-align: center;
    margin-top: 100px;
}

.popup {
    width: 320px;
    background: white;
    border: 1px solid #999;
    box-shadow: 2px 2px 10px #999;
    margin: auto;
}

.title {
    background: #6fa8dc;
    color: white;
    padding: 8px;
    display: flex;
    justify-content: space-between;
}

.content {
    padding: 15px;
    text-align: left;
}

input {
    width: 100%;
    padding: 5px;
}

.buttons {
    text-align: right;
    padding: 10px;
}

button {
    padding: 5px 15px;
}
</style>

</head>

<body>

<div class="popup">
    <div class="title">
        Explorer User Prompt
        <span>X</span>
    </div>

    <div class="content">
        Enter number A
        <input type="text" id="a">
    </div>

    <div class="buttons">
        <button onclick="run()">OK</button>
        <button>Cancel</button>
    </div>
</div>

<script>
function run() {
    let a = document.getElementById("a").value;

    if (isNaN(a) || a == "") {
        alert("Number A is formatted incorrect");
    } else {
        alert("OK: " + a);
    }
}
</script>

</body>
</html>
